<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickExtension Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 20px;
      background-color: #ffffff;
      color: #0a2540;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      border-bottom: 1px solid #e3e8ee;
      padding-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #64748b;
    }
    .status-badge.active-pro {
      background: #dcfce7;
      color: #15803d;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e3e8ee;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .plan-title {
      font-size: 14px;
      font-weight: 600;
      color: #0a2540;
      margin-bottom: 4px;
    }
    .price-display {
      font-size: 26px;
      font-weight: 800;
      color: #0a2540;
      margin-bottom: 4px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .price-sub {
      font-size: 12px;
      color: #697386;
    }
    .perks-list {
      list-style: none;
      margin-top: 14px;
      font-size: 13px;
      color: #425466;
    }
    .perks-list li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      width: 100%;
      height: 42px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s;
    }
    .btn-upgrade {
      background-color: #635bff;
      color: white;
      margin-bottom: 10px;
    }
    .btn-upgrade:hover {
      background-color: #5046e5;
    }
    .btn-check {
      background-color: transparent;
      border: 1px solid #e3e8ee;
      color: #697386;
      font-size: 12px;
      height: 32px;
    }
    .btn-check:hover {
      background-color: #f8fafc;
      color: #0a2540;
    }
    .footer {
      font-size: 11px;
      color: #a0aec0;
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ QuickExtension</div>
    <span id="planBadge" class="status-badge">Free Plan</span>
  </div>

  <div id="unpaidSection">
    <div class="card">
      <div class="plan-title">Pro Plan</div>
      <div class="price-display">
        <span id="extPriceDisplay">$4.99</span>
        <span style="font-size: 13px; font-weight: 400; color: #697386;">/ month</span>
      </div>
      <div class="price-sub">Billed monthly • Cancel anytime</div>
      <ul class="perks-list">
        <li>✓ Unlimited access to all tools</li>
        <li>✓ Real-time cross-browser sync</li>
        <li>✓ Priority customer support</li>
      </ul>
    </div>

    <button id="upgradeBtn" class="btn btn-upgrade">Upgrade to Pro</button>
  </div>

  <div id="paidSection" style="display: none;">
    <div class="card" style="background: #f0fdf4; border-color: #bbf7d0;">
      <div class="plan-title" style="color: #166534;">Pro Membership Active</div>
      <p style="font-size: 12px; color: #15803d; margin-top: 4px;">All premium features are unlocked.</p>
    </div>
    <button id="resetDemoBtn" class="btn btn-check" style="margin-bottom: 8px;">Reset to Free (Demo)</button>
  </div>

  <button id="restoreBtn" class="btn btn-check">Restore Purchase</button>

  <div class="footer">
    Secured by 256-bit encryption
  </div>

  <script src="popup.js"></script>
</body>
</html>
